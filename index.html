<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AgroVision</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #047857;
            --primary-light: #d1fae5;
            --accent-orange: #f59e0b;
            --accent-blue: #0284c7;
            --accent-purple: #8b5cf6;
            --dark: #1f2937;
            --light-bg: #f0fdf4;
            --white: #ffffff;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            transition: all 0.2s ease-in-out;
        }

        body {
            background: linear-gradient(180deg, #ecfdf5 0%, #f0fdf4 100%);
            color: var(--dark);
            padding-bottom: 80px;
            min-height: 100vh;
        }

        header {
            background: linear-gradient(135deg, #059669, #047857);
            color: var(--white);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(4, 120, 87, 0.2);
        }

        header h1 {
            font-size: 1.25rem;
            font-weight: 800;
        }

        .lang-selector select {
            width: auto;
            padding: 6px 12px;
            font-size: 0.85rem;
            border-radius: 20px;
            border: none;
            background: rgba(255, 255, 255, 0.95);
            font-weight: 700;
            color: var(--primary-dark);
            cursor: pointer;
            outline: none;
        }

        .offline-indicator {
            background: var(--danger);
            color: var(--white);
            text-align: center;
            padding: 6px;
            display: none;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .container {
            padding: 16px;
            max-width: 520px;
            margin: auto;
        }

        .card {
            background: var(--white);
            padding: 18px;
            border-radius: 16px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.04);
            border: 1px solid #e5e7eb;
        }

        .card-weather { border-top: 5px solid var(--accent-blue); }
        .card-tips { border-top: 5px solid var(--primary); }
        .card-water { border-top: 5px solid #06b6d4; }
        .card-calc { border-top: 5px solid var(--accent-orange); }
        .card-forum { border-top: 5px solid var(--accent-purple); }

        h2 {
            color: var(--primary-dark);
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        label {
            font-size: 0.88rem;
            font-weight: 600;
            color: #4b5563;
            display: block;
            margin-top: 10px;
            margin-bottom: 4px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px 14px;
            border: 1.5px solid #d1d5db;
            border-radius: 10px;
            font-size: 0.95rem;
            background: #fafafa;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            background: var(--white);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        button.action-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            color: var(--white);
            border: none;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
            font-weight: 700;
            margin-top: 12px;
            box-shadow: 0 3px 8px rgba(16, 185, 129, 0.3);
        }

        button.action-btn:active {
            transform: scale(0.98);
        }

        .result {
            font-weight: 600;
            color: #065f46;
            margin-top: 12px;
            padding: 12px;
            background: var(--primary-light);
            border-radius: 10px;
            border: 1px solid #a7f3d0;
            display: none;
            line-height: 1.5;
            font-size: 0.9rem;
        }

        .post {
            background: #f9fafb;
            border-radius: 10px;
            padding: 12px;
            margin-top: 12px;
            border-left: 4px solid var(--accent-purple);
        }
        .post h3 { font-size: 0.95rem; color: var(--dark); margin-bottom: 4px; }
        .post p { font-size: 0.88rem; color: #4b5563; }

        /* Navigation Sections Control */
        .content-section {
            display: none;
        }
        .content-section.active {
            display: block;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Fixed Bottom Tab Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 62px;
            background: var(--white);
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 -3px 15px rgba(0,0,0,0.06);
            z-index: 1000;
            border-top: 1px solid #e5e7eb;
        }

        .tab-btn {
            background: transparent;
            border: none;
            outline: none;
            color: #9ca3af;
            font-size: 0.72rem;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            padding: 4px 0;
            flex: 1;
            user-select: none;
        }

        .tab-btn svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
            margin-bottom: 3px;
            pointer-events: none;
        }

        .tab-btn span {
            pointer-events: none;
        }

        .tab-btn.active {
            color: var(--primary-dark);
            transform: translateY(-2px);
        }

        .tab-btn.active svg {
            fill: var(--primary-dark);
        }
    </style>
</head>
<body>

    <div id="offlineBanner" class="offline-indicator" data-key="offlineStatus">మీరు ఆఫ్‌లైన్‌లో ఉన్నారు. సేవ్ చేసిన సమాచారం మాత్రమే కనిపిస్తుంది.</div>

    <header>
        <h1>🌾 AgroVision</h1>
        <div class="lang-selector">
            <select id="languageSelect">
                <option value="te">తెలుగు</option>
                <option value="en">English</option>
                <option value="hi">हिंदी</option>
                <option value="ta">தமிழ்</option>
            </select>
        </div>
    </header>

    <div class="container">
        <!-- 1. Home Section -->
        <section id="section-home" class="content-section active">
            <div class="card card-weather">
                <h2 data-key="weatherTitle">☀️ వాతావరణ సమాచారం</h2>
                <p id="weather" data-key="weatherLoading">సమాచారం లోడ్ అవుతోంది...</p>
                <button type="button" class="action-btn" id="refreshWeatherBtn" data-key="refreshBtn">రిఫ్రెష్ చేయండి</button>
            </div>

            <div class="card card-tips">
                <h2 data-key="tipsTitle">🌱 సాగు & తెగుళ్ల నివారణ చిట్కాలు</h2>
                <label for="cropTypeHome" data-key="cropTypeLabel">పంట రకం:</label>
                <select id="cropTypeHome">
                    <option value="వరి" data-key="cropRice">వరి</option>
                    <option value="ప్రత్తి" data-key="cropCotton">ప్రత్తి</option>
                    <option value="మిరప" data-key="cropChili">మిరప</option>
                </select>
                <button type="button" class="action-btn" id="tipsBtn" data-key="showTipsBtn">సూచనలు చూపించు</button>
                <p id="agroTips" class="result"></p>
            </div>
        </section>

        <!-- 2. Irrigation Section -->
        <section id="section-irrigation" class="content-section">
            <div class="card card-water">
                <h2 data-key="irrigationTitle">💧 నీటి ప్రణాళిక (Irrigation)</h2>
                <p style="font-size: 0.88rem; color: #6b7280; line-height: 1.4;" data-key="irrigationDesc">ఈ రోజు వాతావరణం, పంట దశకు తగిన నీటి సమయాన్ని లెక్కించండి.</p>
                <button type="button" class="action-btn" id="irrigationBtn" data-key="calcIrrigationBtn">నీటి అవసరాన్ని లెక్కించు</button>
                <p id="irrigationResult" class="result"></p>
            </div>
        </section>

        <!-- 3. Calculator Section -->
        <section id="section-calc" class="content-section">
            <div class="card card-calc">
                <h2 data-key="calcTitle">⚖️ ఎరువుల కాలిక్యులేటర్</h2>
                <label for="landSize" data-key="landSizeLabel">భూమి వైశాల్యం (ఎకరాల్లో):</label>
                <input type="number" id="landSize" placeholder="ఉదా: 2">

                <label for="cropTypeCalc" data-key="cropTypeLabel">పంట రకం:</label>
                <select id="cropTypeCalc">
                    <option value="వరి" data-key="cropRice">వరి</option>
                    <option value="ప్రత్తి" data-key="cropCotton">ప్రత్తి</option>
                    <option value="మిరప" data-key="cropChili">మిరప</option>
                </select>
                <button type="button" class="action-btn" id="calcFertilizerBtn" data-key="calculateBtn">లెక్కించండి</button>
                <p id="fertilizerResult" class="result"></p>
            </div>
        </section>

        <!-- 4. Forum Section -->
        <section id="section-forum" class="content-section">
            <div class="card card-forum">
                <h2 data-key="forumTitle">💬 రైతు కమ్యూనిటీ ఫోరమ్</h2>
                <label data-key="postPlaceholderTitle">శీర్షిక</label>
                <input type="text" id="postTitle">
                <label data-key="postPlaceholderContent">సందేశం</label>
                <textarea id="postContent" rows="3"></textarea>
                <button type="button" class="action-btn" id="savePostBtn" data-key="postBtn">పోస్ట్ చేయండి</button>
                <div id="postsContainer"></div>
            </div>
        </section>
    </div>

    <!-- Fixed Bottom Navigation -->
    <nav class="bottom-nav">
        <button type="button" class="tab-btn active" data-target="section-home">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            <span data-key="navHome">హోమ్</span>
        </button>
        <button type="button" class="tab-btn" data-target="section-irrigation">
            <svg viewBox="0 0 24 24"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
            <span data-key="navWater">నీటి సరఫరా</span>
        </button>
        <button type="button" class="tab-btn" data-target="section-calc">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4 6h-2V7h2v2zm-4 0H9V7h2v2zm4 4h-2v-2h2v2zm-4 0H9v-2h2v2zm-2 4v-2h2v2H9zm4 0v-2h2v2h-2z"/></svg>
            <span data-key="navCalc">కాలిక్యులేటర్</span>
        </button>
        <button type="button" class="tab-btn" data-target="section-forum">
            <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-3 9H7V9h10v2zm-4 4H7v-2h6v2z"/></svg>
            <span data-key="navForum">ఫోరమ్</span>
        </button>
    </nav>

                weatherLoading: "தகவல் ஏற்றப்படுகிறது...",
                refreshBtn: "புதுப்பிக்கவும்",
                tipsTitle: "🌱 விவசாய குறிப்புகள் & பூச்சிக் கட்டுப்பாடு",
                cropTypeLabel: "பயிர் வகை:",
                cropRice: "நெல்",
                cropCotton: "பருத்தி",
                cropChili: "மிளகாய்",
                showTipsBtn: "குறிப்புகளைக் காட்டு",
                calcTitle: "⚖️ உர கால்குலேட்டர்",
                landSizeLabel: "நிலத்தின் அளவு (ஏக்கரில்):",
                calculateBtn: "கணக்கிடு",
                calcResult: (crop, acres, nitro, phos) => `${acres} ஏக்கர் ${crop} பயிருக்கு: ${nitro} கிலோ யூரியா மற்றும் ${phos} கிலோ DAP தேவைப்படுகிறது.`,
                calcError: "சரியான ஏக்கர் அளவை உள்ளிடவும்.",
                tipsResult: "உரம் இடுவதற்கு முன் மண்ணில் போதிய ஈரப்பதம் இருப்பதை உறுதி செய்யவும். வேப்ப எண்ணெய் கரைசல் தெளிக்கவும்.",
                irrigationTitle: "💧 நீர்ப்பாசன வழிகாட்டி",
                irrigationDesc: "வானிலைக்கேற்ப பயிருக்கு தேவையான நீரின் அளவை கணக்கிடுங்கள்.",
                calcIrrigationBtn: "நீரின் தேவையை கணக்கிடு",
                irrigationResult: "இன்றைய வானிலைப்படி: பயிருக்கு 20-25 லிட்டர் நீர் தேவை. சொட்டு நீர்ப்பாசனத்தை 1.5 மணி நேரம் இயக்கவும்.",
                forumTitle: "💬 உழவர் மன்றம்",
                postPlaceholderTitle: "தலைப்பு",
                postPlaceholderContent: "உங்கள் பதிவை எழுதுங்கள்...",
                postBtn: "பதிவிடு",
                weatherOnline: "வெப்பநிலை: 31°C | ஈரப்பதம்: 65% | மழை வாய்ப்பில்லை.",
                weatherOffline: "ஆஃப்லைன்: நெட்வொர்க் கிடைக்கவில்லை."
            }
        };

        let currentLang = 'te';

        function changeLanguage() {
            const select = document.getElementById('languageSelect');
            currentLang = select.value;
            localStorage.setItem('preferredLang', currentLang);
            updateUI();
        }

        function updateUI() {
            const langData = translations[currentLang];
            document.querySelectorAll('[data-key]').forEach(element => {
                const key = element.getAttribute('data-key');
                if (langData && langData[key]) {
                    element.innerText = langData[key];
                }
            });
            getWeather();
        }

        function switchTab(targetId) {
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.getAttribute('data-target') === targetId) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            document.querySelectorAll('.content-section').forEach(section => {
                section.classList.remove('active');
            });

            const activeSection = document.getElementById(targetId);
            if (activeSection) {
                activeSection.classList.add('active');
            }
        }

        function getWeather() {
            const weatherDiv = document.getElementById('weather');
            const langData = translations[currentLang];
            if (navigator.onLine) {
                weatherDiv.innerText = langData.weatherOnline;
                localStorage.setItem('cachedWeather', weatherDiv.innerText);
            } else {
                const cached = localStorage.getItem('cachedWeather');
                weatherDiv.innerText = cached ? cached + " (Saved)" : langData.weatherOffline;
            }
        }

        function calculateFertilizer() {
            const acres = parseFloat(document.getElementById('landSize').value);
            const cropSelect = document.getElementById('cropTypeCalc');
            const crop = cropSelect.options[cropSelect.selectedIndex].text;
            const resultParagraph = document.getElementById('fertilizerResult');
            const langData = translations[currentLang];

            if (!isNaN(acres) && acres > 0) {
                let nitrogen = Math.round(acres * 55);
                let phosphorus = Math.round(acres * 30);
                resultParagraph.innerText = langData.calcResult(crop, acres, nitrogen, phosphorus);
                resultParagraph.style.display = 'block';
            } else {
                resultParagraph.innerText = langData.calcError;
                resultParagraph.style.display = 'block';
            }
        }

        function showTips() {
            const resultParagraph = document.getElementById('agroTips');
            resultParagraph.innerText = translations[currentLang].tipsResult;
            resultParagraph.style.display = 'block';
        }

        function calculateIrrigation() {
            const resultParagraph = document.getElementById('irrigationResult');
            resultParagraph.innerText = translations[currentLang].irrigationResult;
            resultParagraph.style.display = 'block';
        }

        function savePost() {
            const titleInput = document.getElementById('postTitle');
            const contentInput = document.getElementById('postContent');
            const title = titleInput.value.trim();
            const content = contentInput.value.trim();

            if (title && content) {
                const posts = JSON.parse(localStorage.getItem('forumPosts') || '[]');
                posts.unshift({ title, content });
                localStorage.setItem('forumPosts', JSON.stringify(posts));
                titleInput.value = '';
                contentInput.value = '';
                renderPosts();
            }
        }

        function renderPosts() {
            const postsContainer = document.getElementById('postsContainer');
            postsContainer.innerHTML = '';
            const posts = JSON.parse(localStorage.getItem('forumPosts') || '[]');

            if (posts.length === 0) {
                postsContainer.innerHTML = `<p style="text-align:center; color:#9ca3af; font-size:0.85rem; margin-top:15px;">ఇంకా పోస్ట్‌లు లేవు (No posts yet)</p>`;
                return;
            }

            posts.forEach(post => {
                const postDiv = document.createElement('div');
                postDiv.className = 'post';
                postDiv.innerHTML = `<h3>${post.title}</h3><p>${post.content}</p>`;
                postsContainer.appendChild(postDiv);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            // Setup Tab Click Navigation
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const targetId = this.getAttribute('data-target');
                    switchTab(targetId);
                });
            });

            // Action Buttons Event Listeners
            document.getElementById('languageSelect').addEventListener('change', changeLanguage);
            document.getElementById('refreshWeatherBtn').addEventListener('click', getWeather);
            document.getElementById('tipsBtn').addEventListener('click', showTips);
            document.getElementById('irrigationBtn').addEventListener('click', calculateIrrigation);
            document.getElementById('calcFertilizerBtn').addEventListener('click', calculateFertilizer);
            document.getElementById('savePostBtn').addEventListener('click', savePost);

            // Restore Language Preference
            const savedLang = localStorage.getItem('preferredLang');
            if (savedLang) {
                currentLang = savedLang;
                document.getElementById('languageSelect').value = savedLang;
            }

            updateUI();
            renderPosts();

            // Online/Offline detection
            window.addEventListener('online', () => {
                document.getElementById('offlineBanner').style.display = 'none';
                getWeather();
            });
            window.addEventListener('offline', () => {
                document.getElementById('offlineBanner').style.display = 'block';
                getWeather();
            });
        });
    </script>
</body>
</html>
